<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- dizzy stars -->
  <g opacity="0.9">
    <polygon points="80,55 86,70 102,70 89,80 94,95 80,86 66,95 71,80 58,70 74,70"
      fill="#ffe066"/>
    <polygon points="240,45 245,57 258,57 248,65 252,78 240,70 228,78 232,65 222,57 235,57"
      fill="#ffe066"/>
  </g>

  <!-- body -->
  <g filter="url(#shadow)">
    <ellipse cx="160" cy="180" rx="82" ry="88" fill="#67a85d"/>

    <!-- belly -->
    <ellipse cx="160" cy="205" rx="42" ry="36" fill="#88c27d"/>

    <!-- ears -->
    <polygon points="100,105 75,55 125,85" fill="#67a85d"/>
    <polygon points="220,105 245,55 195,85" fill="#67a85d"/>

    <!-- head -->
    <circle cx="160" cy="120" r="72" fill="#7dcf70"/>

    <!-- dizzy eyes -->
    <g stroke="#222" stroke-width="5" stroke-linecap="round">
      <line x1="123" y1="108" x2="140" y2="125"/>
      <line x1="140" y1="108" x2="123" y2="125"/>

      <line x1="180" y1="108" x2="197" y2="125"/>
      <line x1="197" y1="108" x2="180" y2="125"/>
    </g>

    <!-- mouth -->
    <ellipse cx="160" cy="152" rx="18" ry="10" fill="#3b1d1d"/>

    <!-- tongue -->
    <ellipse cx="160" cy="157" rx="8" ry="5" fill="#ff7b9c"/>

    <!-- teeth -->
    <rect x="148" y="144" width="8" height="6" rx="1" fill="#fff"/>
    <rect x="164" y="144" width="8" height="6" rx="1" fill="#fff"/>

    <!-- arms -->
    <g stroke="#67a85d" stroke-width="18" stroke-linecap="round">
      <line x1="92" y1="180" x2="52" y2="210"/>
      <line x1="228" y1="180" x2="268" y2="205"/>
    </g>

    <!-- hands -->
    <circle cx="48" cy="214" r="12" fill="#7dcf70"/>
    <circle cx="272" cy="209" r="12" fill="#7dcf70"/>

    <!-- legs -->
    <g stroke="#67a85d" stroke-width="20" stroke-linecap="round">
      <line x1="135" y1="255" x2="125" y2="292"/>
      <line x1="185" y1="255" x2="195" y2="292"/>
    </g>

    <!-- feet -->
    <ellipse cx="120" cy="300" rx="18" ry="10" fill="#4d7f46"/>
    <ellipse cx="200" cy="300" rx="18" ry="10" fill="#4d7f46"/>
  </g>

  <!-- dizzy swirl -->
  <path d="M120 45 Q160 10 200 45" fill="none" stroke="#cfcfcf" stroke-width="4" stroke-dasharray="6 8"/>
</svg>
