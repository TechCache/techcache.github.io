<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="fireGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffef99"/>
      <stop offset="50%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ff3b30"/>
    </linearGradient>
  </defs>

  <!-- chaos smoke -->
  <g opacity="0.5">
    <circle cx="70" cy="60" r="24" fill="#666"/>
    <circle cx="95" cy="52" r="18" fill="#777"/>
    <circle cx="245" cy="70" r="22" fill="#666"/>
    <circle cx="265" cy="55" r="16" fill="#777"/>
  </g>

  <!-- warning text -->
  <text x="25" y="38" font-size="18" fill="#ff4d4d" font-family="monospace">
    WARNING
  </text>

  <!-- goblin -->
  <g filter="url(#shadow)">
    <!-- body -->
    <ellipse cx="160" cy="185" rx="88" ry="94" fill="#6bb25e"/>

    <!-- belly -->
    <ellipse cx="160" cy="215" rx="45" ry="38" fill="#8fd180"/>

    <!-- ears -->
    <polygon points="98,102 70,48 128,84" fill="#67a85d"/>
    <polygon points="222,102 250,48 192,84" fill="#67a85d"/>

    <!-- head -->
    <circle cx="160" cy="120" r="76" fill="#7fe06f"/>

    <!-- eyes -->
    <ellipse cx="126" cy="112" rx="14" ry="18" fill="#fff"/>
    <ellipse cx="194" cy="112" rx="14" ry="18" fill="#fff"/>

    <!-- pupils -->
    <circle cx="126" cy="116" r="6" fill="#ff3b30"/>
    <circle cx="194" cy="116" r="6" fill="#ff3b30"/>

    <!-- angry eyebrows -->
    <g stroke="#2d4728" stroke-width="6" stroke-linecap="round">
      <line x1="108" y1="92" x2="138" y2="102"/>
      <line x1="182" y1="102" x2="212" y2="92"/>
    </g>

    <!-- catastrophic grin -->
    <path d="M118 152 Q160 200 202 152" fill="#2b1212"/>

    <!-- teeth -->
    <g fill="#fff">
      <rect x="128" y="156" width="8" height="10" rx="1"/>
      <rect x="142" y="164" width="8" height="10" rx="1"/>
      <rect x="156" y="168" width="8" height="10" rx="1"/>
      <rect x="170" y="164" width="8" height="10" rx="1"/>
      <rect x="184" y="156" width="8" height="10" rx="1"/>
    </g>

    <!-- tongue -->
    <ellipse cx="160" cy="182" rx="16" ry="8" fill="#ff6b81"/>

    <!-- arms flailing -->
    <g stroke="#67a85d" stroke-width="18" stroke-linecap="round">
      <line x1="92" y1="178" x2="35" y2="120"/>
      <line x1="228" y1="178" x2="285" y2="120"/>
    </g>

    <!-- hands -->
    <circle cx="32" cy="118" r="12" fill="#7fe06f"/>
    <circle cx="288" cy="118" r="12" fill="#7fe06f"/>

    <!-- legs -->
    <g stroke="#67a85d" stroke-width="22" stroke-linecap="round">
      <line x1="132" y1="265" x2="110" y2="305"/>
      <line x1="188" y1="265" x2="210" y2="305"/>
    </g>

    <!-- feet -->
    <ellipse cx="104" cy="308" rx="20" ry="12" fill="#4d7f46"/>
    <ellipse cx="216" cy="308" rx="20" ry="12" fill="#4d7f46"/>
  </g>

  <!-- fire/explosion accents -->
  <g opacity="0.95">
    <polygon points="58,180 68,160 78,180 68,172" fill="url(#fireGlow)"/>
    <polygon points="252,190 264,166 276,190 264,178" fill="url(#fireGlow)"/>
  </g>

  <!-- catastrophic banner -->
  <g transform="rotate(-6 160 235)">
    <rect x="58" y="220" width="204" height="38" rx="8" fill="#ffcc00"/>
    <text x="75" y="245" font-size="18" font-family="monospace" fill="#1b1b1b">
      CATASTROPHICALLY FINE
    </text>
  </g>
</svg>
