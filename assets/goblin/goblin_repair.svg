<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- duct tape -->
  <g transform="rotate(-8 160 110)">
    <rect x="110" y="90" width="100" height="28" rx="4" fill="#8b8f95"/>
    <line x1="120" y1="104" x2="200" y2="104" stroke="#b8bcc2" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- body -->
  <g filter="url(#shadow)">
    <ellipse cx="160" cy="180" rx="82" ry="88" fill="#67a85d"/>

    <!-- belly -->
    <ellipse cx="160" cy="205" rx="42" ry="36" fill="#88c27d"/>

    <!-- ears -->
    <polygon points="100,105 75,55 125,85" fill="#67a85d"/>
    <polygon points="220,105 245,55 195,85" fill="#67a85d"/>

    <!-- head -->
    <circle cx="160" cy="120" r="72" fill="#7dcf70"/>

    <!-- eyes -->
    <ellipse cx="128" cy="116" rx="10" ry="14" fill="#fff"/>
    <ellipse cx="192" cy="116" rx="10" ry="14" fill="#fff"/>

    <circle cx="130" cy="120" r="4" fill="#222"/>
    <circle cx="194" cy="120" r="4" fill="#222"/>

    <!-- eyebrows -->
    <g stroke="#355c31" stroke-width="5" stroke-linecap="round">
      <line x1="115" y1="98" x2="138" y2="102"/>
      <line x1="182" y1="102" x2="205" y2="98"/>
    </g>

    <!-- mouth -->
    <path d="M140 152 Q160 170 180 152" fill="none" stroke="#3b1d1d" stroke-width="5" stroke-linecap="round"/>

    <!-- arms -->
    <g stroke="#67a85d" stroke-width="18" stroke-linecap="round">
      <line x1="92" y1="180" x2="58" y2="195"/>
      <line x1="228" y1="180" x2="262" y2="195"/>
    </g>

    <!-- hands -->
    <circle cx="54" cy="198" r="12" fill="#7dcf70"/>
    <circle cx="266" cy="198" r="12" fill="#7dcf70"/>

    <!-- wrench -->
    <g transform="rotate(18 248 178)">
      <rect x="236" y="170" width="12" height="42" rx="4" fill="#9aa1a8"/>
      <circle cx="242" cy="165" r="10" fill="none" stroke="#9aa1a8" stroke-width="6"/>
    </g>

    <!-- legs -->
    <g stroke="#67a85d" stroke-width="20" stroke-linecap="round">
      <line x1="135" y1="255" x2="125" y2="292"/>
      <line x1="185" y1="255" x2="195" y2="292"/>
    </g>

    <!-- feet -->
    <ellipse cx="120" cy="300" rx="18" ry="10" fill="#4d7f46"/>
    <ellipse cx="200" cy="300" rx="18" ry="10" fill="#4d7f46"/>
  </g>

  <!-- floating repair symbols -->
  <g opacity="0.9">
    <text x="70" y="70" font-size="26" fill="#ffe066">+</text>
    <text x="235" y="80" font-size="22" fill="#7cff95">✓</text>
  </g>
</svg>
