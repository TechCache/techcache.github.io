<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0908">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Goblin Phone Stand Stress Relief — cartoon fake screen damage. Not real. Very goblin.">
  <title>Goblin Stand | Tech Cachet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="preload" href="/assets/goblin/goblin_idle.svg" as="image" type="image/svg+xml">
  <style>
    :root {
      --bg-deep: #0a0908;
      --bg: #141210;
      --tape: #9a9a8a;
      --tape-shine: #c4c4b8;
      --off-white: #e8e2d4;
      --grime: #2a2420;
      --hazard: #e85d04;
      --neon: #39ff14;
      --neon-dim: rgba(57, 255, 20, 0.35);
      --font-hand: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --z-screen: 0;
      --z-damage: 10;
      --z-stage: 20;
      --z-hud: 30;
      --z-controls: 40;
      --radius: 10px;
      --goblin-size: clamp(164px, 46vw, 280px);
      --goblin-bottom: calc(154px + var(--safe-bottom));
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      -webkit-tap-highlight-color: transparent;
      height: 100%;
    }

    body {
      font-family: var(--font);
      background: var(--bg-deep);
      color: var(--off-white);
      min-height: 100dvh;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      touch-action: manipulation;
    }

    /* The "phone screen" — entire viewport */
    .screen-bg {
      position: fixed;
      inset: 0;
      z-index: var(--z-screen);
      pointer-events: none;
      background:
        radial-gradient(ellipse 140% 90% at 50% 0%, rgba(60, 45, 30, 0.18) 0%, transparent 50%),
        radial-gradient(ellipse 80% 60% at 80% 100%, rgba(20, 30, 20, 0.15) 0%, transparent 45%),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(0, 0, 0, 0.04) 3px,
          rgba(0, 0, 0, 0.04) 4px
        ),
        linear-gradient(175deg, #0d0b0a 0%, var(--bg) 35%, #0a0908 100%);
    }

    .screen-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
      opacity: 0.5;
      mix-blend-mode: overlay;
    }

    body.damage-tier-2 .screen-bg { filter: contrast(1.04) saturate(0.92); }
    body.damage-tier-3 .screen-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(57, 255, 20, 0.025) 2px,
        rgba(57, 255, 20, 0.025) 4px
      );
    }

    body.is-shaking {
      animation: screen-shake 0.45s ease;
    }

    body.is-glitching {
      animation: glitch-offset 0.35s steps(4) 2;
    }

    @keyframes screen-shake {
      0%, 100% { transform: translate(0, 0); }
      15% { transform: translate(-8px, 3px); }
      30% { transform: translate(7px, -4px); }
      45% { transform: translate(-5px, 2px); }
      60% { transform: translate(9px, 3px); }
      75% { transform: translate(-4px, -3px); }
    }

    @keyframes glitch-offset {
      0%, 100% { transform: translate(0, 0); filter: none; }
      12% { transform: translate(-6px, 3px); filter: hue-rotate(35deg) saturate(1.3); }
      25% { transform: translate(7px, -4px); filter: contrast(1.25); }
      38% { transform: translate(-5px, 2px); filter: hue-rotate(-15deg); }
      50% { transform: translate(8px, -3px); }
      62% { transform: translate(-7px, 1px); filter: contrast(1.35) brightness(1.1); }
      75% { transform: translate(4px, -2px); filter: hue-rotate(25deg); }
      88% { transform: translate(-4px, 3px); }
    }

    body.is-glitching.is-worse-glitch {
      animation: glitch-offset 0.28s steps(5) 3;
    }

    body.is-glitching.is-worse-glitch .screen-bg {
      animation: worse-scanlines 0.35s steps(3) 2;
    }

    @keyframes worse-scanlines {
      0%, 100% { filter: none; }
      33% { filter: contrast(1.2) brightness(0.9); }
      66% { filter: hue-rotate(12deg) saturate(1.2); }
    }

  /* Full-viewport damage overlays */
    #damage-layer {
      position: fixed;
      inset: 0;
      z-index: var(--z-damage);
      pointer-events: none;
      overflow: hidden;
    }

    .crack-svg {
      position: absolute;
      width: 100%;
      height: 100%;
      left: 0;
      top: 0;
      opacity: 0;
      animation: crack-in 0.35s ease forwards;
    }

    @keyframes crack-in {
      to { opacity: 1; }
    }

    .crack-svg path {
      fill: none;
      stroke: rgba(255, 255, 255, 0.4);
      stroke-width: 1.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .crack-svg path:nth-child(2) { stroke: rgba(200, 200, 195, 0.25); stroke-width: 0.8; }
    .crack-svg path:nth-child(3) { stroke: rgba(255, 255, 255, 0.15); stroke-width: 2; }

    .smudge-blob {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(
        ellipse at 40% 35%,
        rgba(90, 75, 55, 0.55) 0%,
        rgba(50, 42, 35, 0.35) 45%,
        transparent 72%
      );
      filter: blur(6px);
      opacity: 0;
      animation: smudge-in 0.5s ease forwards;
    }

    @keyframes smudge-in {
      to { opacity: 0.88; }
    }

    .glitch-bar {
      position: absolute;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--neon), #ff006e, var(--neon), transparent);
      opacity: 0.75;
      mix-blend-mode: screen;
      animation: glitch-bar-flash 0.5s steps(3) forwards;
    }

    @keyframes glitch-bar-flash {
      0% { opacity: 0.9; transform: scaleX(1); }
      100% { opacity: 0.35; transform: scaleX(1); }
    }

    body.is-glitching .glitch-bar {
      animation: glitch-bar-slide 0.6s steps(4) infinite;
    }

    @keyframes glitch-bar-slide {
      0% { transform: translateY(0); }
      50% { transform: translateY(8vh); }
      100% { transform: translateY(-4vh); }
    }

    .warning-sticker {
      position: absolute;
      font-family: var(--font-hand);
      font-size: clamp(0.65rem, 2.8vw, 0.85rem);
      color: var(--hazard);
      background: rgba(232, 93, 4, 0.15);
      padding: 4px 8px;
      border: 2px dashed var(--hazard);
      transform: rotate(var(--rot, -6deg));
      opacity: 0;
      animation: sticker-in 0.4s ease forwards;
      z-index: 2;
    }

    @keyframes sticker-in {
      to { opacity: 1; }
    }

    .warning-sticker.is-pulse {
      animation: sticker-pulse 1.2s ease infinite;
    }

    @keyframes sticker-pulse {
      50% { opacity: 0.55; transform: rotate(var(--rot, -6deg)) scale(1.03); }
    }

    .duct-tape-strip {
      position: absolute;
      background: linear-gradient(135deg, var(--tape) 0%, var(--tape-shine) 42%, var(--tape) 100%);
      border-radius: 2px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
      opacity: 0;
      animation: tape-in 0.3s ease forwards;
      z-index: 3;
    }

    .duct-tape-strip::before,
    .duct-tape-strip::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(0, 0, 0, 0.1);
    }

    .duct-tape-strip::before { top: 32%; }
    .duct-tape-strip::after { top: 68%; }

    @keyframes tape-in {
      to { opacity: 0.92; }
    }

    .smoke-puff {
      position: absolute;
      width: clamp(36px, 12vw, 64px);
      height: clamp(36px, 12vw, 64px);
      background: radial-gradient(circle, rgba(170, 168, 158, 0.55) 0%, transparent 70%);
      border-radius: 50%;
      opacity: 0;
      transform: scale(0.4);
      z-index: 4;
    }

    .smoke-puff.is-active {
      animation: smoke-rise 1.4s ease-out forwards;
    }

    @keyframes smoke-rise {
      0% { opacity: 0.75; transform: scale(0.4) translateY(0); }
      100% { opacity: 0; transform: scale(2) translateY(-90px); }
    }

    .catastrophic-stamp {
      position: absolute;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%) rotate(-12deg);
      font-family: var(--font-hand);
      font-size: clamp(1.8rem, 9vw, 3.2rem);
      font-weight: 700;
      color: var(--neon);
      text-shadow: 0 0 24px var(--neon-dim), 3px 3px 0 var(--grime);
      border: 4px solid var(--neon);
      padding: 12px 20px;
      background: rgba(15, 12, 10, 0.55);
      opacity: 0;
      pointer-events: none;
      z-index: 8;
      white-space: nowrap;
    }

    body.is-catastrophic .catastrophic-stamp {
      opacity: 1;
      animation: stamp-pulse 1.4s ease infinite;
    }

    @keyframes stamp-pulse {
      50% { text-shadow: 0 0 36px var(--neon); transform: translate(-50%, -50%) rotate(-12deg) scale(1.02); }
    }

    body.is-catastrophic .screen-bg {
      animation: catastrophic-flicker 2.5s ease infinite;
    }

    @keyframes catastrophic-flicker {
      0%, 100% { filter: brightness(0.85) contrast(1.1); }
      48% { filter: brightness(1) contrast(1.15); }
      50% { filter: brightness(0.7); }
      52% { filter: brightness(0.95); }
    }

    /* Goblin stage: fixed viewport character, never a boxed panel */
    .stage {
      position: fixed;
      inset: 0;
      z-index: var(--z-stage);
      pointer-events: none;
    }

    .goblin-zone {
      pointer-events: auto;
      background: none;
      border: none;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
    }

    #goblin-container:focus-visible {
      outline: 2px solid var(--neon);
      outline-offset: 6px;
      border-radius: 12px;
    }

    .speech-bubble {
      position: fixed;
      left: 50%;
      bottom: calc(var(--goblin-bottom) + var(--goblin-size) - 2px);
      z-index: calc(var(--z-stage) + 1);
      max-width: min(92vw, 340px);
      background:
        linear-gradient(145deg, #d8d0bc 0%, var(--off-white) 35%, #cfc6b0 100%);
      color: var(--bg-deep);
      font-family: var(--font-hand);
      font-size: clamp(1rem, 4.2vw, 1.2rem);
      font-weight: 700;
      padding: 12px 16px 10px;
      border-radius: 4px;
      border: 2px solid var(--grime);
      box-shadow: 3px 3px 0 var(--grime), inset 0 0 0 1px rgba(255, 255, 255, 0.35);
      text-align: center;
      line-height: 1.25;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 6px) rotate(-1deg);
      transition: opacity 0.28s ease, transform 0.28s ease;
    }

    .speech-bubble.is-visible {
      opacity: 1;
      transform: translate(-50%, 0) rotate(-1deg);
      animation: speech-wobble 5s ease-in-out infinite;
    }

    .speech-bubble::before {
      content: "";
      position: absolute;
      top: -7px;
      left: 18%;
      width: 42%;
      height: 14px;
      background: linear-gradient(135deg, var(--tape) 0%, var(--tape-shine) 50%, var(--tape) 100%);
      border-radius: 1px;
      transform: rotate(-4deg);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
      opacity: 0.92;
    }

    .speech-bubble::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      border: 10px solid transparent;
      border-top-color: #cfc6b0;
      border-bottom: none;
    }

    @keyframes speech-wobble {
      0%, 100% { transform: translate(-50%, 0) rotate(-1deg); }
      50% { transform: translate(-50%, -2px) rotate(0.8deg); }
    }

    body.is-bonked .speech-bubble.is-visible {
      animation: bonk-pop 0.35s ease, speech-wobble 5s ease-in-out 0.35s infinite;
    }

    @keyframes bonk-pop {
      0% { transform: translate(-50%, 0) scale(1) rotate(-1deg); }
      40% { transform: translate(-50%, 0) scale(1.06) rotate(-3deg); }
      100% { transform: translate(-50%, 0) scale(1) rotate(-1deg); }
    }

    /* External SVG goblin — GoblinController target */
    #goblin-container {
      position: fixed;
      left: 50%;
      bottom: var(--goblin-bottom);
      z-index: var(--z-stage);
      width: var(--goblin-size);
      height: var(--goblin-size);
      margin-left: calc(var(--goblin-size) * -0.5);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      transform-origin: center bottom;
      animation: goblin-idle-float 3.4s ease-in-out infinite;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.55));
      -webkit-user-select: none;
      user-select: none;
      pointer-events: auto;
      touch-action: manipulation;
    }

    #goblin-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: bottom center;
      pointer-events: none;
      display: block;
    }

    @keyframes goblin-idle-float {
      0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
      45%, 55% { transform: translateY(-5px) scale(1.02, 0.98) rotate(-0.6deg); }
      75% { transform: translateY(-2px) scale(0.99, 1.01) rotate(0.5deg); }
    }

    @keyframes goblin-bonk-squash {
      0% { transform: translateY(0) scale(1, 1); }
      35% { transform: translateY(8px) scale(1.1, 0.78); }
      55% { transform: translateY(3px) scale(0.95, 1.05); }
      100% { transform: translateY(0) scale(1, 1); }
    }

    @keyframes goblin-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-5px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(3px); }
    }

    @keyframes goblin-repair-wobble {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      25% { transform: rotate(2deg) translateY(-2px); }
      75% { transform: rotate(-2deg) translateY(-1px); }
    }

    @keyframes goblin-catastrophic-pulse {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.04) translateY(-3px); }
    }

    @keyframes goblin-angry-shake {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-2px, 1px) rotate(-1deg); }
      50% { transform: translate(3px, -1px) rotate(1deg); }
      75% { transform: translate(-2px, 0) rotate(-0.5deg); }
    }

    #goblin-container.goblin-hit {
      animation: goblin-bonk-squash 0.48s ease forwards, goblin-shake 0.48s ease;
    }

    #goblin-container.goblin-shake {
      animation: goblin-shake 0.45s ease;
    }

    #goblin-container.goblin-repair {
      animation: goblin-repair-wobble 2s ease-in-out 2;
    }

    #goblin-container.goblin-catastrophic,
    #goblin-container[data-state="catastrophic"] {
      animation: goblin-catastrophic-pulse 0.55s ease-in-out infinite, goblin-angry-shake 0.25s ease-in-out infinite;
    }

    #goblin-container:active {
      transform: translateY(4px) scale(0.97, 1.02);
    }

    .impact-burst {
      position: absolute;
      left: 50%;
      top: 38%;
      width: 56px;
      height: 56px;
      margin: -28px 0 0 -28px;
      pointer-events: none;
      opacity: 0;
      z-index: 2;
    }

    .impact-burst.is-active {
      animation: impact-burst-pop 0.42s ease-out forwards;
    }

    .impact-burst::before,
    .impact-burst::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid var(--off-white);
    }

    .impact-burst::after {
      inset: 12px;
      border-color: var(--hazard);
      border-width: 2px;
    }

    @keyframes impact-burst-pop {
      0% { opacity: 0; transform: scale(0.3) rotate(0deg); }
      25% { opacity: 1; transform: scale(1) rotate(8deg); }
      100% { opacity: 0; transform: scale(1.6) rotate(-12deg); }
    }

    @keyframes goblin-flail {
      0% { transform: rotate(0deg) translateY(0); }
      25% { transform: rotate(-10deg) translateY(-4px); }
      50% { transform: rotate(12deg) translateY(2px); }
      75% { transform: rotate(-8deg) translateY(-2px); }
      100% { transform: rotate(0deg) translateY(0); }
    }

    #goblin-container.goblin-worse {
      animation: goblin-flail 0.55s ease-in-out 2;
    }

    /* Minimal HUD */
    .hud {
      position: fixed;
      z-index: var(--z-hud);
      font-family: var(--font-mono);
      font-size: 0.65rem;
      line-height: 1.35;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    .hud--tl {
      top: calc(8px + var(--safe-top));
      left: calc(10px + var(--safe-left));
      max-width: 48%;
    }

    .hud--tr {
      top: calc(8px + var(--safe-top));
      right: calc(10px + var(--safe-right));
      text-align: right;
      max-width: 48%;
    }

    .hud__label {
      font-family: var(--font-hand);
      font-size: 0.95rem;
      color: var(--off-white);
      display: block;
    }

    .hud__value {
      color: var(--neon);
      font-weight: 600;
    }

    .hud__value.is-critical {
      color: var(--hazard);
      animation: value-pulse 0.8s ease infinite;
    }

    @keyframes value-pulse {
      50% { opacity: 0.7; }
    }

    .hud__bar {
      width: min(140px, 38vw);
      height: 6px;
      margin-top: 4px;
      background: var(--grime);
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid #1a1614;
    }

    .hud__bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--neon), #7fff00 50%, var(--hazard));
      transition: width 0.35s ease;
    }

    .hud__bar-fill.is-critical {
      background: linear-gradient(90deg, var(--hazard), #ff006e);
    }

    .hud__meta {
      font-size: 0.55rem;
      color: var(--tape);
      margin-top: 2px;
      opacity: 0.85;
    }

    /* Controls */
    .controls {
      position: fixed;
      left: calc(8px + var(--safe-left));
      right: calc(8px + var(--safe-right));
      bottom: calc(8px + var(--safe-bottom));
      z-index: var(--z-controls);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      max-width: 520px;
      margin: 0 auto;
    }

    .btn {
      font-family: var(--font-hand);
      font-size: clamp(0.9rem, 3.5vw, 1.05rem);
      font-weight: 700;
      padding: 11px 8px;
      border: 2px solid var(--grime);
      border-radius: var(--radius);
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      box-shadow: 2px 2px 0 var(--grime);
      -webkit-user-select: none;
      user-select: none;
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 var(--grime);
    }

    .btn:focus-visible {
      outline: 2px solid var(--neon);
      outline-offset: 2px;
    }

    .btn--bonk {
      grid-column: span 2;
      background: var(--hazard);
      color: var(--off-white);
      font-size: clamp(1.1rem, 4.5vw, 1.3rem);
    }

    .btn--tape {
      background: var(--tape);
      color: var(--bg-deep);
    }

    .btn--worse {
      background: linear-gradient(135deg, #2a1a2a, #4a2040);
      color: #ff6b9d;
      border-color: #ff006e;
    }

    .btn--reset {
      grid-column: span 2;
      background: #5c4510;
      color: var(--off-white);
      font-size: 0.9rem;
    }

    .footer-note {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(2px + var(--safe-bottom));
      z-index: var(--z-controls);
      font-family: var(--font-mono);
      font-size: 0.5rem;
      color: var(--tape);
      text-align: center;
      opacity: 0.5;
      pointer-events: none;
      padding: 0 8px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      body.is-shaking,
      body.is-glitching {
        animation: none;
      }
      #goblin-container,
      #goblin-container[data-state="catastrophic"],
      .impact-burst.is-active {
        animation: none !important;
      }
      #goblin-container.goblin-hit {

  <p class="footer-note">Cartoon stress toy · Tap goblin to bonk · NFC stand hook eventually</p>

  <!-- TODO: Optional muted bonk sound — <audio id="bonkSound" muted> + toggle, default muted -->
  <script>
    (function () {
      'use strict';

      // TODO: NFC world's-worst-phone-stand product hook — read tag ID, personalize goblin greeting, analytics ping
      // TODO: Optional muted bonk sound — <audio> with user toggle, default muted

      /* ============================================================

         ============================================================ */
      const GoblinController = (function () {
        const ASSET_BASE = '/assets/goblin/goblin_';

            'Structural integrity is a social construct.',
            'DO NOT BONK THE ENGINEER.',
            'That crack was already there.',
            'Congratulations, you made it worse.',
            'OSHA has entered the chat.',
            'Held together by hope and poor decisions.',
            'This stand was rated for a single sigh.',
            'You bonked the load-bearing attitude.',
            'The pixels filed a complaint.',
            'I am not paid enough for this cardboard.',
            'Your phone is judging you silently.',
            'Goblin OSHA says: bonk responsibly.',
            'That was not in the assembly manual.',
            'We\'re past "stable" and into "vibes".',

        };

        let container = null;
        let sprite = null;
        let speechBubble = null;
        let impactBurst = null;
        let currentState = 'idle';
        let tempTimer = null;
        let lastPhraseIndex = -1;
        let prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function assetPath(state) {
          return ASSET_BASE + state + '.svg';
        }

        function init(opts) {
          container = opts.container;
          speechBubble = opts.speechBubble;
          impactBurst = opts.impactBurst;

          sprite = document.createElement('img');
          sprite.id = 'goblinSprite';
          sprite.alt = '';
          sprite.setAttribute('aria-hidden', 'true');
          sprite.setAttribute('decoding', 'async');
          container.appendChild(sprite);

          VALID_STATES.forEach(function (s) {
            const preload = new Image();
            preload.src = assetPath(s);
          });

          setGoblinState('idle');
        }

        function setGoblinState(stateName) {
          if (VALID_STATES.indexOf(stateName) === -1) return;
          currentState = stateName;
          sprite.src = assetPath(stateName);
          container.dataset.state = stateName;
          container.classList.toggle('goblin-catastrophic', stateName === 'catastrophic');
        }

        function clearTempTimer() {
          if (tempTimer) {
            clearTimeout(tempTimer);
            tempTimer = null;
          }
        }

        function clearTempClasses() {
          TEMP_CLASSES.forEach(function (c) {
            container.classList.remove(c);
          });
        }

        function addTempClass(className, durationMs, onDone) {
          clearTempTimer();
          clearTempClasses();
          container.classList.add(className);
          tempTimer = setTimeout(function () {
            container.classList.remove(className);
            tempTimer = null;
            if (onDone) onDone();
          }, prefersReducedMotion ? 80 : durationMs);
        }

        function pickPhrase(stateOrList) {
          const list = typeof stateOrList === 'string'
            ? (PHRASES[stateOrList] || PHRASES.general)
            : stateOrList;
          if (list.length === 1) return list[0];
          let idx;
          do {
            idx = Math.floor(Math.random() * list.length);
          } while (idx === lastPhraseIndex && list.length > 1);
          lastPhraseIndex = idx;
          return list[idx];
        }

        function showPhrase(text, state) {
          speechBubble.textContent = text || pickPhrase(state || currentState);
          speechBubble.classList.remove('is-visible');
          void speechBubble.offsetWidth;
          speechBubble.classList.add('is-visible');
        }

        function triggerImpactBurst() {
          impactBurst.classList.remove('is-active');
          void impactBurst.offsetWidth;
          impactBurst.classList.add('is-active');
          setTimeout(function () {
            impactBurst.classList.remove('is-active');
          }, prefersReducedMotion ? 80 : 450);
        }

        function resolvePostBonkState(integrity) {
          if (integrity <= 0) return 'catastrophic';
          if (integrity < 30 && Math.random() > 0.45) return 'dizzy';
          if (integrity < 60) return 'angry';
          return 'idle';
        }

        function syncFromIntegrity(integrity) {
          if (integrity <= 0) {
            setGoblinState('catastrophic');
            return;
          }
          if (currentState === 'catastrophic' || currentState === 'bonked' || currentState === 'repair') return;
          if (integrity < 30) {
            setGoblinState(Math.random() > 0.5 ? 'dizzy' : 'angry');
          } else if (integrity < 60) {
            setGoblinState('angry');
          } else {
            setGoblinState('idle');
          }
        }

        function reset() {
          clearTempTimer();
          clearTempClasses();
          lastPhraseIndex = -1;
          setGoblinState('idle');
        }

        function getState() {
          return currentState;
        }

        return {
          init: init,
          setGoblinState: setGoblinState,
          showPhrase: showPhrase,
          pickPhrase: pickPhrase,
          addTempClass: addTempClass,
          triggerImpactBurst: triggerImpactBurst,
          resolvePostBonkState: resolvePostBonkState,
          syncFromIntegrity: syncFromIntegrity,
          reset: reset,
          getState: getState,
          PHRASES: PHRASES,
        };
      })();

      /* ============================================================
         SoundController — tiny generated workshop noises, no assets
         ============================================================ */
      const SoundController = (function () {
        const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
        let ctx = null;
        let master = null;

        function ensureContext() {
          if (!AudioContextCtor) return null;
          if (!ctx) {
            ctx = new AudioContextCtor();
            master = ctx.createGain();
            master.gain.value = 0.34;
            master.connect(ctx.destination);
          }
          if (ctx.state === 'suspended') ctx.resume();
          return ctx;
        }

        function now() {
          const audio = ensureContext();
          return audio ? audio.currentTime : 0;
        }

        function tone(freq, duration, type, start, volume, endFreq) {
          const audio = ensureContext();
          if (!audio) return;
          const t = start == null ? audio.currentTime : start;
          const osc = audio.createOscillator();
          const gain = audio.createGain();
          osc.type = type || 'square';
          osc.frequency.setValueAtTime(freq, t);
          if (endFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), t + duration);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(volume || 0.18, t + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
          osc.connect(gain);
          gain.connect(master);
          osc.start(t);
          osc.stop(t + duration + 0.03);
        }

        function noise(duration, start, volume, lowpass) {
          const audio = ensureContext();
          if (!audio) return;
          const t = start == null ? audio.currentTime : start;
          const buffer = audio.createBuffer(1, Math.max(1, Math.floor(audio.sampleRate * duration)), audio.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
          const src = audio.createBufferSource();
          const filter = audio.createBiquadFilter();
          const gain = audio.createGain();
          src.buffer = buffer;
          filter.type = 'lowpass';
          filter.frequency.value = lowpass || 1200;
          gain.gain.setValueAtTime(volume || 0.12, t);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
          src.connect(filter);
          filter.connect(gain);
          gain.connect(master);
          src.start(t);
          src.stop(t + duration + 0.03);
        }

        function bonk() {
          const t = now();
          tone(150, 0.16, 'triangle', t, 0.26, 72);
          tone(540, 0.05, 'square', t + 0.02, 0.08, 260);
          noise(0.11, t, 0.08, 900);
        }

        function repair() {
          const t = now();
          noise(0.18, t, 0.13, 2600);
          tone(320, 0.08, 'sawtooth', t + 0.05, 0.08, 420);
          tone(250, 0.08, 'sawtooth', t + 0.14, 0.07, 340);
        }

        function worse() {
          const t = now();
          tone(90, 0.32, 'sawtooth', t, 0.22, 42);
          tone(760, 0.12, 'square', t + 0.04, 0.09, 140);
          noise(0.35, t + 0.02, 0.14, 1700);
        }

        function catastrophic() {
          const t = now();
          tone(55, 0.55, 'sawtooth', t, 0.26, 24);
          tone(980, 0.22, 'square', t + 0.02, 0.08, 110);
          tone(140, 0.28, 'triangle', t + 0.24, 0.16, 38);
          noise(0.55, t, 0.18, 900);
        }

        function reset() {
          const t = now();
          tone(260, 0.07, 'triangle', t, 0.08, 360);
          tone(410, 0.09, 'triangle', t + 0.08, 0.08, 560);
          tone(620, 0.12, 'triangle', t + 0.17, 0.07, 760);
        }

        return {
          bonk: bonk,
          repair: repair,
          worse: worse,
          catastrophic: catastrophic,
          reset: reset,
        };
      })();

      const WARNING_LABELS = [
        'WARRANTY VOID',
        'DO NOT EAT',
        'BONK ZONE',
        'SCREEN MAY SHATTER (EMOTIONALLY)',
        'NOT OSHA APPROVED',
        'PIXELS AT LARGE',
      ];

      const DAMAGE_TIERS = [
        { minIntegrity: 76, tier: 0, minCracks: 0, minSmudges: 0, minGlitches: 0, minWarnings: 0 },
        { minIntegrity: 51, tier: 1, minCracks: 2, minSmudges: 0, minGlitches: 0, minWarnings: 0 },
        { minIntegrity: 31, tier: 2, minCracks: 4, minSmudges: 2, minGlitches: 0, minWarnings: 1 },
        { minIntegrity: 11, tier: 3, minCracks: 7, minSmudges: 4, minGlitches: 2, minWarnings: 2 },
        { minIntegrity: 0,  tier: 4, minCracks: 12, minSmudges: 6, minGlitches: 4, minWarnings: 4 },
      ];

      const MOOD_THRESHOLDS = [
        { minIntegrity: 70, label: 'Annoyed' },
        { minIntegrity: 40, label: 'Furious' },
        { minIntegrity: 0,  label: 'Unhinged' },
      ];

      const DAMAGE_LABELS = [
        { minIntegrity: 76, label: 'Stable-ish' },
        { minIntegrity: 51, label: 'Questionable' },
        { minIntegrity: 26, label: 'OSHA Incident' },
        { minIntegrity: 0,  label: 'Held Together By Hope' },
      ];

      let integrity = 100;
      let bonkTotal = 0;
      let lastImpact = { x: 50, y: 55 };
      let hasPlayedCatastrophicSound = false;

      let counts = { cracks: 0, smudges: 0, glitches: 0, warnings: 0, tape: 0 };

      const damageLayer = document.getElementById('damage-layer');
      const catastrophicStamp = document.getElementById('catastrophicStamp');

      const els = {

      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      GoblinController.init({

      window.GoblinController = GoblinController;

      function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function randomFloat(min, max) {
        return Math.random() * (max - min) + min;

      function pickPhrase(list) {

      function getTierConfig() {
        for (let i = 0; i < DAMAGE_TIERS.length; i++) {
          if (integrity >= DAMAGE_TIERS[i].minIntegrity) return DAMAGE_TIERS[i];
        }
        return DAMAGE_TIERS[DAMAGE_TIERS.length - 1];
      }

      function labelForThreshold(integrityVal, thresholds) {
        for (let i = 0; i < thresholds.length; i++) {
          if (integrityVal >= thresholds[i].minIntegrity) return thresholds[i].label;
        }
        return thresholds[thresholds.length - 1].label;
      }

      function recordImpact(clientX, clientY) {
        if (typeof clientX === 'number' && typeof clientY === 'number') {
          lastImpact.x = (clientX / window.innerWidth) * 100;
          lastImpact.y = (clientY / window.innerHeight) * 100;
        }
      }

      function jaggedPath(ox, oy, branches, reach) {
        const parts = [];
        for (let b = 0; b < branches; b++) {
          const angle = (Math.PI * 2 * b) / branches + randomFloat(-0.4, 0.4);
          let d = 'M' + ox + ' ' + oy;
          let x = ox;
          let y = oy;
          const segs = randomInt(3, 5);
          for (let s = 0; s < segs; s++) {
            const step = reach * (0.35 + (s / segs) * 0.65) * randomFloat(0.7, 1.1);
            const wobble = randomFloat(-18, 18);
            x += Math.cos(angle) * step + wobble * 0.15;
            y += Math.sin(angle) * step + wobble * 0.15;
            d += ' L' + x.toFixed(1) + ' ' + y.toFixed(1);
          }
          parts.push(d);
        }
        return parts;
      }

      function addCrack(originX, originY, intensity) {
        const ox = originX != null ? originX : randomFloat(15, 85);
        const oy = originY != null ? originY : randomFloat(15, 85);
        const branches = intensity === 'heavy' ? randomInt(4, 6) : randomInt(2, 4);
        const reach = intensity === 'heavy' ? randomFloat(28, 48) : randomFloat(14, 28);

        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'crack-svg');
        svg.setAttribute('viewBox', '0 0 100 100');
        svg.setAttribute('preserveAspectRatio', 'none');
        svg.setAttribute('aria-hidden', 'true');

        const paths = jaggedPath(ox, oy, branches, reach);
        paths.forEach(function (d) {
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', d);
          svg.appendChild(path);
        });

        damageLayer.insertBefore(svg, catastrophicStamp);
        counts.cracks += 1;
      }

      function addSmudge() {
        const el = document.createElement('div');
        el.className = 'smudge-blob';
        const w = randomInt(50, 120);
        const h = randomInt(40, 100);
        el.style.width = w + 'px';

      function addGlitchBar(persistent) {

          setTimeout(function () {

      }

      function addWarningSticker(pulse) {
        const el = document.createElement('span');
        el.className = 'warning-sticker' + (pulse ? ' is-pulse' : '');
        el.textContent = WARNING_LABELS[randomInt(0, WARNING_LABELS.length - 1)];

      function addTapeStrip() {
        const el = document.createElement('div');
        el.className = 'duct-tape-strip';

          el.style.transform = 'rotate(' + randomFloat(-8, 8) + 'deg)';
        } else {
          el.style.width = randomInt(70, 140) + 'px';
          el.style.height = randomInt(16, 24) + 'px';
          el.style.left = randomFloat(5, 80) + '%';
          el.style.top = randomFloat(10, 75) + '%';
          el.style.transform = 'rotate(' + randomFloat(-25, 25) + 'deg)';
        }
        damageLayer.insertBefore(el, catastrophicStamp);
        counts.tape += 1;
      }

      function spawnSmoke(count, nearX, nearY) {
        for (let i = 0; i < count; i++) {
          const puff = document.createElement('div');
          puff.className = 'smoke-puff';
          const baseX = nearX != null ? nearX : randomFloat(20, 80);
          const baseY = nearY != null ? nearY : randomFloat(35, 75);
          puff.style.left = (baseX + randomFloat(-8, 8)) + '%';
          puff.style.top = (baseY + randomFloat(-5, 5)) + '%';

          requestAnimationFrame(function () {
            puff.classList.add('is-active');
          });
          setTimeout(function () {
            puff.remove();
          }, prefersReducedMotion ? 100 : 1500);
        }
      }

      function triggerGlitch(durationMs, harder) {
        document.body.classList.add('is-glitching');
        if (harder) document.body.classList.add('is-worse-glitch');
        const bars = harder ? 7 : (integrity <= 25 ? 5 : 3);
        for (let i = 0; i < bars; i++) addGlitchBar(false);
        const ms = prefersReducedMotion ? 50 : (durationMs || 400);
        setTimeout(function () {
          document.body.classList.remove('is-glitching', 'is-worse-glitch');
        }, ms);
      }

      function syncGoblinFromIntegrity() {
        GoblinController.syncFromIntegrity(integrity);
      }

      function triggerBonkAnim() {
        document.body.classList.add('is-bonked');
        GoblinController.setGoblinState('bonked');
        GoblinController.showPhrase(null, 'bonked');
        GoblinController.addTempClass('goblin-hit', 480, function () {
          if (integrity > 0) {
            GoblinController.setGoblinState(GoblinController.resolvePostBonkState(integrity));
          }
        });
        GoblinController.triggerImpactBurst();
        setTimeout(function () {
          document.body.classList.remove('is-bonked');
        }, prefersReducedMotion ? 80 : 400);
      }

      function ensureTierMinimums() {
        const cfg = getTierConfig();
        while (counts.cracks < cfg.minCracks) {
          addCrack(randomFloat(10, 90), randomFloat(10, 90), 'light');
        }
        while (counts.smudges < cfg.minSmudges) addSmudge();
        while (counts.warnings < cfg.minWarnings) addWarningSticker(cfg.tier >= 4);
        while (counts.glitches < cfg.minGlitches) addGlitchBar(true);
      }

      function applyBodyTier() {
        const cfg = getTierConfig();
        for (let t = 0; t <= 4; t++) {
          document.body.classList.remove('damage-tier-' + t);
        }
        if (cfg.tier > 0) document.body.classList.add('damage-tier-' + cfg.tier);
        document.body.classList.toggle('is-catastrophic', integrity <= 0);
      }

      function catastrophicBurst() {
        for (let i = 0; i < 8; i++) {
          addCrack(randomFloat(5, 95), randomFloat(5, 95), 'heavy');
        }
        for (let j = 0; j < 4; j++) addSmudge();
        for (let k = 0; k < 3; k++) addWarningSticker(true);
        spawnSmoke(5, lastImpact.x, lastImpact.y);
        if (!prefersReducedMotion) triggerGlitch(600);
      }

      function updateUI() {
        const pct = Math.max(0, Math.min(100, Math.round(integrity)));
        els.integrityText.textContent = pct + '%';
        els.integrityFill.style.width = pct + '%';
        els.integrityBar.setAttribute('aria-valuenow', String(pct));
        const critical = pct <= 25 && pct > 0;
        els.integrityText.classList.toggle('is-critical', critical);
        els.integrityFill.classList.toggle('is-critical', critical);
        els.moodText.textContent = labelForThreshold(integrity, MOOD_THRESHOLDS);
        els.damageLevelText.textContent =
          labelForThreshold(integrity, DAMAGE_LABELS) + ' · Bonks: ' + bonkTotal;

        applyBodyTier();
        ensureTierMinimums();

        if (integrity <= 0 && counts.cracks < 15) catastrophicBurst();
        syncGoblinFromIntegrity();
        if (integrity <= 0) {
          setPhrase(GoblinController.pickPhrase('catastrophic'));
          if (!hasPlayedCatastrophicSound) {
            SoundController.catastrophic();
            hasPlayedCatastrophicSound = true;
          }
        }
      }

      function triggerShake() {
        if (prefersReducedMotion) return;
        document.body.classList.remove('is-shaking');
        void document.body.offsetWidth;
        document.body.classList.add('is-shaking');
        GoblinController.addTempClass('goblin-shake', 450);
        setTimeout(function () {
          document.body.classList.remove('is-shaking');
        }, 450);
      }

      function addBonkEffects(amount, heavy) {
        const intensity = heavy || amount >= 18 ? 'heavy' : 'light';
        addCrack(lastImpact.x, lastImpact.y, intensity);
        if (Math.random() > 0.35 || heavy) addSmudge();
        if (amount >= 8 || heavy) {
          spawnSmoke(heavy ? 4 : amount >= 12 ? 2 : 1, lastImpact.x, lastImpact.y);
        }
        if (amount >= 10 || heavy) triggerGlitch(heavy ? 500 : 350);
        if (heavy) {
          addCrack(randomFloat(10, 90), randomFloat(10, 90), 'heavy');
          addCrack(randomFloat(10, 90), randomFloat(10, 90), 'heavy');
        }
        if (integrity <= 40 && Math.random() > 0.5) addWarningSticker(integrity <= 15);
      }

      function applyDamage(amount, heavy) {
        if (integrity <= 0) {
          setPhrase(GoblinController.pickPhrase('catastrophic'));
          if (!heavy) spawnSmoke(1, lastImpact.x, lastImpact.y);
          return;
        }
        integrity = Math.max(0, integrity - amount);
        bonkTotal += 1;
        SoundController.bonk();
        triggerShake();
        triggerBonkAnim();
        addBonkEffects(amount, heavy);
        updateUI();
      }

      function bonk(ev) {
        if (ev && ev.clientX != null) recordImpact(ev.clientX, ev.clientY);
        else {
          const rect = els.goblinContainer.getBoundingClientRect();
          recordImpact(rect.left + rect.width / 2, rect.top + rect.height * 0.4);
        }
        applyDamage(randomInt(5, 12), false);
      }

      function repairWithTape() {
        if (integrity <= 0) {
          GoblinController.setGoblinState('catastrophic');
          setPhrase(GoblinController.pickPhrase('catastrophic'));
          spawnSmoke(2, lastImpact.x, lastImpact.y);
          return;
        }
        integrity = Math.min(100, integrity + randomInt(15, 25));
        hasPlayedCatastrophicSound = false;
        SoundController.repair();
        setPhrase(GoblinController.pickPhrase('repair'));
        GoblinController.setGoblinState('repair');
        GoblinController.addTempClass('goblin-repair', prefersReducedMotion ? 120 : 1400, function () {
          if (integrity > 0) {
            GoblinController.setGoblinState(integrity < 60 ? 'angry' : 'idle');
          }
        });
        addTapeStrip();
        if (Math.random() > 0.4) addTapeStrip();
        updateUI();
      }

      function makeItWorse() {
        recordImpact(randomFloat(0.2, 0.8) * window.innerWidth, randomFloat(0.2, 0.7) * window.innerHeight);
        integrity = Math.max(0, integrity - randomInt(18, 32));
        bonkTotal += 1;
        SoundController.worse();
        setPhrase(GoblinController.pickPhrase('worse'));
        triggerShake();
        const worseState = Math.random() > 0.5 ? 'angry' : 'dizzy';
        GoblinController.setGoblinState(worseState);
        GoblinController.addTempClass('goblin-worse', prefersReducedMotion ? 100 : 750, function () {
          if (integrity > 0) syncGoblinFromIntegrity();
        });
        addBonkEffects(24, true);
        if (!prefersReducedMotion) triggerGlitch(650, true);
        updateUI();
      }

      function clearDamageLayer() {
        const keep = catastrophicStamp;
        damageLayer.innerHTML = '';
        damageLayer.appendChild(keep);
        counts = { cracks: 0, smudges: 0, glitches: 0, warnings: 0, tape: 0 };
      }

      function resetDamage() {
        integrity = 100;
        bonkTotal = 0;
        lastImpact = { x: 50, y: 55 };
        hasPlayedCatastrophicSound = false;
        SoundController.reset();
        setPhrase('Fresh pixels. Try not to bonk the engineer immediately.', 'idle');
        document.body.classList.remove(
          'is-shaking', 'is-bonked', 'is-glitching', 'is-worse-glitch', 'is-catastrophic'
        );
        for (let t = 0; t <= 4; t++) document.body.classList.remove('damage-tier-' + t);
        GoblinController.reset();
        els.impactBurst.classList.remove('is-active');
        clearDamageLayer();
        updateUI();
      }

      els.goblinContainer.addEventListener('click', function (e) {
        e.preventDefault();
        bonk(e);
      });

      els.goblinContainer.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          bonk();
        }
      });

      document.getElementById('btnBonk').addEventListener('click', function () {
        const rect = els.goblinContainer.getBoundingClientRect();
        recordImpact(rect.left + rect.width / 2, rect.top + rect.height * 0.35);
        bonk();
      });

      document.getElementById('btnTape').addEventListener('click', repairWithTape);
      document.getElementById('btnWorse').addEventListener('click', makeItWorse);
      document.getElementById('btnReset').addEventListener('click', resetDamage);

      setPhrase('Tap me to bonk. This screen can\'t stop you. Legally.', 'idle');
      updateUI();
    })();
  </script>
</body>
</html>
